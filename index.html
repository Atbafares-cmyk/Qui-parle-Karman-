<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101010">
<meta name="color-scheme" content="dark light">
<title>Qui parle ? Triangle de Karpman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script>
/* Thème appliqué avant le rendu pour éviter tout flash. Le choix est partagé entre les jeux 23 MindSet. */
(function () {
  var t = null;
  try { t = localStorage.getItem("23mindset-theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") {
    t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
  }
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<style>
:root {
  --bg: #101010;
  --surface: #1b1b1b;
  --surface2: #262626;
  --text: #f4f0ee;
  --muted: #a9a29f;
  --line: #3a3a3a;
  --brand: #E25667;
  --brand-text: #EE7080;
  --on-brand: #101010;
  --ok: #4CC38A;
  --ko: #FF7C7C;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  --ring: rgba(226, 86, 103, .55);
}
:root[data-theme="light"] {
  --bg: #FAF6F4;
  --surface: #FFFFFF;
  --surface2: #F1EAE7;
  --text: #101010;
  --muted: #5E5755;
  --line: #DCD1CD;
  --brand: #E25667;
  --brand-text: #B02A41;
  --on-brand: #101010;
  --ok: #1E8A57;
  --ko: #C23636;
  --shadow: 0 10px 28px rgba(60, 30, 30, .14);
  --ring: rgba(176, 42, 65, .4);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  transition: background .25s, color .25s;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }

.app {
  min-height: 100vh;
  min-height: 100dvh;
  max-width: 720px;
  margin: 0 auto;
  padding: 0 16px;
  display: flex;
  flex-direction: column;
}
.top {
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(12px + env(safe-area-inset-top)) 0 8px;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .02em; font-size: .95rem; }
.brand .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--brand); display: inline-block; }
.theme-btn {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--line);
  display: grid; place-items: center;
}
.theme-btn svg { width: 22px; height: 22px; }
.theme-btn .sun { display: none; }
:root[data-theme="dark"] .theme-btn .sun { display: block; }
:root[data-theme="dark"] .theme-btn .moon { display: none; }

main { flex: 1; display: flex; flex-direction: column; }
.foot .copy { margin-top: 2px; }
.foot { text-align: center; color: var(--muted); font-size: .78rem; padding: 10px 0 calc(14px + env(safe-area-inset-bottom)); }

/* Écran d'intro */
.intro { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 8px 0 12px; }
.kicker { color: var(--brand-text); font-weight: 700; font-size: .82rem; letter-spacing: .12em; text-transform: uppercase; }
h1 { font-size: clamp(1.9rem, 7vw, 2.6rem); line-height: 1.08; margin: 0; letter-spacing: -.01em; }
.lead { font-size: 1.08rem; margin: 0; }
.meta { color: var(--muted); font-size: .9rem; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line);
  font-weight: 500; font-size: .92rem;
}
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--brand)); display: inline-block; }
.note {
  border: 2px solid var(--text); border-radius: 14px; padding: 12px 14px;
  font-size: .9rem; background: var(--surface);
}
.note b { display: block; margin-bottom: 2px; }
.btn {
  min-height: 52px; padding: 0 22px; border-radius: 14px; border: 0;
  background: var(--brand); color: var(--on-brand); font-weight: 700; font-size: 1.05rem;
  box-shadow: 0 6px 18px rgba(226, 86, 103, .28);
  transition: transform .12s;
}
.btn:active { transform: scale(.98); }
.btn.ghost { background: transparent; color: var(--text); border: 2px solid var(--line); box-shadow: none; }

/* Jeu */
.hud { display: flex; align-items: center; gap: 12px; padding: 4px 0 2px; }
.progress { flex: 1; height: 8px; background: var(--surface2); border-radius: 999px; overflow: hidden; }
.progress .bar { height: 100%; width: 0; background: var(--brand); border-radius: 999px; transition: width .35s; }
.count { font-size: .88rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

.stage { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; padding: 14px 0; }
.card {
  width: 100%; max-width: 430px; min-height: 150px;
  padding: 26px 22px;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 22px;
  box-shadow: var(--shadow);
  font-size: 1.3rem; font-weight: 500; line-height: 1.32; text-align: center;
  display: flex; align-items: center; justify-content: center;
  touch-action: none; user-select: none; -webkit-user-select: none;
  cursor: grab;
  transition: transform .28s cubic-bezier(.2, .8, .2, 1), border-color .2s, background .2s;
  position: relative;
}
.card.drag { transition: none; cursor: grabbing; z-index: 15; box-shadow: 0 18px 44px rgba(0, 0, 0, .45); }
.card.ok { border-color: var(--ok); }
.card.ko { border-color: var(--ko); }
.card.enter { animation: enter .3s ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
.hint { margin: 0; color: var(--muted); font-size: .9rem; text-align: center; }

.zones { display: grid; gap: 10px; padding-bottom: 14px; }
.zones.z3 { grid-template-columns: repeat(3, 1fr); }
.zones.z4, .zones.z5 { grid-template-columns: repeat(2, 1fr); }
.zones.z5 .zone:last-child { grid-column: 1 / -1; }
.zone {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  min-height: 96px; padding: 12px 8px;
  background: var(--surface); border: 2px solid var(--line); border-top: 5px solid var(--c);
  border-radius: 16px; text-align: center;
  transition: transform .12s, background .15s, border-color .15s;
}
.zone .ico { width: 40px; height: 40px; color: var(--c); }
.zone .ico svg { width: 100%; height: 100%; display: block; }
.zone .lbl { font-weight: 700; font-size: 1.02rem; line-height: 1.15; }
.zone .sub { font-size: .76rem; color: var(--muted); line-height: 1.2; }
.zones.z4 .zone, .zones.z5 .zone { min-height: 112px; justify-content: flex-start; padding-top: 12px; }
.zones.z4 .zone .ico, .zones.z5 .zone .ico { width: 48px; height: 48px; }
.zones.z5 .zone:last-child { min-height: 78px; flex-direction: row; justify-content: center; gap: 12px; padding-top: 12px; }
.zones.z5 .zone:last-child .ico { width: 34px; height: 34px; }
.zones.z5 .zone:last-child .txt { display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
.zones.z5 .zone:last-child { border-left-style: dashed; border-right-style: dashed; border-bottom-style: dashed; }
.zone.hover { background: var(--surface2); border-color: var(--c); transform: scale(1.03); }
.zone:active { transform: scale(.97); }
.zones.off .zone { pointer-events: none; opacity: .5; }

/* Feuille de correction */
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  transform: translateY(110%); visibility: hidden;
  transition: transform .3s cubic-bezier(.2, .8, .2, 1), visibility 0s .3s;
  background: var(--surface); border-top: 4px solid var(--fb, var(--line));
  border-radius: 24px 24px 0 0; box-shadow: 0 -14px 44px rgba(0, 0, 0, .4);
  max-height: 72vh; max-height: 72dvh; overflow: auto;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
}
.sheet.show { transform: none; visibility: visible; transition: transform .3s cubic-bezier(.2, .8, .2, 1), visibility 0s; }
.sheet .in { max-width: 688px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.verdict { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.25rem; }
.verdict svg { width: 28px; height: 28px; flex: none; }
.verdict.ok { color: var(--ok); }
.verdict.ko { color: var(--ko); }
.answer-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: .95rem; }
.why { margin: 0; font-size: 1rem; }
.debate-tag { font-size: .82rem; color: var(--brand-text); font-weight: 700; }

/* Résultat */
.result { flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 8px 0 16px; }
.score-wrap { display: flex; align-items: center; gap: 18px; }
.ring { width: 118px; height: 118px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--surface2); }
.ring .val { stroke: var(--brand); transition: stroke-dashoffset .9s cubic-bezier(.2, .8, .2, 1); }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 1.7rem; font-variant-numeric: tabular-nums; }
.score-msg h2 { margin: 0 0 4px; font-size: 1.4rem; line-height: 1.15; }
.score-msg p { margin: 0; color: var(--muted); }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; }
.block h3 { margin: 0 0 8px; font-size: 1.05rem; }
.recap { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.recap li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--surface2); font-size: .95rem; }
.recap svg { width: 20px; height: 20px; flex: none; margin-top: 2px; }
.recap li.ok svg { color: var(--ok); }
.recap li.ko svg { color: var(--ko); }
.recap .small { display: block; font-size: .82rem; color: var(--muted); margin-top: 2px; }
.debate p { margin: 6px 0; }
.debate ul { margin: 6px 0 10px; padding-left: 20px; }
.debate .q { font-weight: 700; }
.reveal { display: none; margin-top: 10px; padding: 10px 12px; border-left: 4px solid var(--brand); background: var(--surface2); border-radius: 0 12px 12px 0; }
.reveal.show { display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.closing { font-size: .95rem; color: var(--muted); margin: 0; }

@media (min-width: 560px) {
  .zone .sub { font-size: .82rem; }
  .card { font-size: 1.5rem; min-height: 180px; }
}
@media (max-width: 370px) {
  .zones.z3 .zone .sub { display: none; }
  .zones.z3 .zone { min-height: 84px; }
  .card { font-size: 1.18rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="dot" aria-hidden="true"></span><span>23 MindSet</span></div>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Basculer entre le mode clair et le mode sombre" title="Mode clair / sombre">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>
  <main id="screen" aria-live="polite"></main>
  <div class="foot"><div>Vos réponses ne sont pas enregistrées. Ce jeu fonctionne sans compte.</div><div class="copy">© <span id="yr">2026</span> 23 MindSet · Fares ATBA. Tous droits réservés.</div></div>
</div>
<div class="sheet" id="sheet" role="status" aria-live="polite" aria-hidden="true"></div>

<script>
function karpIcon(v) {
  // Triangle de Karpman : Persécuteur en haut à gauche, Sauveur en haut à droite, Victime en bas.
  var pts = { p: [8, 10], s: [40, 10], v: [24, 40] };
  var dots = "";
  Object.keys(pts).forEach(function (k) {
    var on = k === v;
    dots += '<circle cx="' + pts[k][0] + '" cy="' + pts[k][1] + '" r="' + (on ? 6.5 : 2.6) + '" fill="currentColor"' + (on ? "" : ' opacity=".45"') + "/>";
  });
  return '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M8 10H40L24 40Z" opacity=".5"/>' + dots + "</svg>";
}

var GAME = {
  kicker: "Déléguer sans s’épuiser · Jeu de tri",
  title: "Qui parle ?",
  consigne: "Neuf répliques, trois rôles. Classez chaque réplique en Victime, Persécuteur ou Sauveur. La correction est immédiate.",
  meta: "9 répliques · environ 10 minutes · glissez la carte ou touchez un rôle",
  debateTag: "Une réplique qui se discute : vous en reparlerez avec votre formateur.",
  hint: "Glissez la carte vers un rôle, ou touchez directement un rôle.",
  quote: true,
  note: {
    title: "Ce dont on ne parle pas ici",
    text: "Ces trois mots décrivent des rôles relationnels du quotidien professionnel. Ils ne servent jamais à qualifier une situation de harcèlement, d’agression ou d’abus de pouvoir. Une personne réellement victime n’est pas responsable de ce qui lui arrive."
  },
  categories: [
    { id: "victime", label: "Victime", sub: "« Je n’y peux rien »", color: "#8E6BBF", icon: karpIcon("v") },
    { id: "persecuteur", label: "Persécuteur", sub: "« C’est de ta faute »", color: "#C4504D", icon: karpIcon("p") },
    { id: "sauveur", label: "Sauveur", sub: "« Laisse, je m’en occupe »", color: "#D9731A", icon: karpIcon("s") }
  ],
  cards: [
    { t: "Je n’y arrive pas, ça me dépasse.", c: "victime",
      why: "Impuissance affichée, et attente que quelqu’un d’autre prenne la main. C’est la posture de la Victime." },
    { t: "De toute façon, on ne me donne jamais les moyens de réussir.", c: "victime",
      why: "« Je n’y peux rien » : la cause est placée à l’extérieur, l’action devient impossible. C’est la Victime." },
    { t: "Tu le ferais mieux que moi.", c: "victime",
      why: "Elle se met en position basse pour que l’autre reprenne le sujet. Une invitation directe au Sauveur." },

    { t: "C’est encore de ta faute si on est en retard.", c: "persecuteur",
      why: "On cherche un coupable plutôt qu’une solution. C’est le Persécuteur : « c’est de ta faute »." },
    { t: "Tu ne fais jamais attention, je suis obligé de tout contrôler.", c: "persecuteur",
      why: "Critique généralisée et contrôle. Le Persécuteur pose son exigence en rabaissant l’autre." },
    { t: "Tu fais comme je te dis, sans discuter.", c: "persecuteur",
      why: "Il impose sans laisser d’espace à l’autre. C’est le Persécuteur, même si l’intention est de gagner du temps." },

    { t: "Ne t’inquiète pas, je regarde ça ce soir.", c: "sauveur", debate: true,
      why: "Le ton est bienveillant, mais la tâche revient au manager et l’autre n’a pas à apprendre. C’est du sauvetage." },
    { t: "Laisse, je connais le contact, je m’en occupe.", c: "sauveur", debate: true,
      why: "Aider sans qu’on le demande, faire à la place. L’autre reste dépendant : c’est le Sauveur." },
    { t: "Je vais le refaire, tu as assez à faire.", c: "sauveur", debate: true,
      why: "Reprendre une tâche déléguée, c’est du sauvetage. Ça se voit comme de la bienveillance et ça fonctionne comme un frein." }
  ],
  bands: [
    { min: 9, title: "Sans faute", text: "Vous reconnaissez les trois rôles, y compris quand ils sont polis." },
    { min: 6, title: "Bon repérage", text: "Regardez surtout les répliques ratées : ce sont souvent celles qui semblent gentilles." },
    { min: 0, title: "Un point de départ", text: "Ce jeu est fait pour se tromper. Les répliques bienveillantes sont les plus trompeuses." }
  ],
  debrief: {
    title: "Les trois répliques qui se discutent",
    question: "Qu’est-ce qui fait que ces trois phrases, si gentilles, appartiennent au même jeu ?",
    answer: "Elles dispensent l’autre d’apprendre. Ce classement est discutable, et le débat vaut mieux que la bonne réponse."
  },
  closing: "Ce sont des rôles, pas des personnes. On en change plusieurs fois dans la même conversation, y compris en mieux."
};

</script>
<script>
(function () {
  "use strict";
  var G = GAME;
  var $ = function (s) { return document.querySelector(s); };
  var screen = $("#screen");
  var sheet = $("#sheet");
  var cats = {};
  G.categories.forEach(function (c) { cats[c.id] = c; });

  var ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>';
  var ICON_KO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg>';

  var order = [], idx = 0, answers = [], locked = false, cardEl = null;

  /* ---------- Thème ---------- */
  function setTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", t === "light" ? "#FAF6F4" : "#101010");
    try { localStorage.setItem("23mindset-theme", t); } catch (e) {}
  }
  $("#themeBtn").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    setTheme(cur === "light" ? "dark" : "light");
  });
  setTheme(document.documentElement.getAttribute("data-theme"));
  var yr = document.getElementById("yr");
  if (yr) yr.textContent = String(new Date().getFullYear());

  /* ---------- Outils ---------- */
  function esc(s) {
    return String(s).replace(/« /g, "«\u00A0").replace(/ »/g, "\u00A0»").replace(/ ([?:!;])/g, "\u00A0$1").replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function shuffle(a) {
    var r = a.slice();
    for (var i = r.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }
  function qt(t) { return G.quote ? "«\u00A0" + t + "\u00A0»" : t; }
  function chipHTML(id) {
    var c = cats[id];
    return '<span class="chip" style="--c:' + c.color + '"><i></i>' + esc(c.label) + '</span>';
  }

  /* ---------- Intro ---------- */
  function renderIntro() {
    hideSheet();
    var chips = G.categories.map(function (c) { return chipHTML(c.id); }).join("");
    var note = G.note ? '<div class="note"><b>' + esc(G.note.title) + '</b>' + esc(G.note.text) + '</div>' : "";
    screen.innerHTML =
      '<section class="intro">' +
        '<div class="kicker">' + esc(G.kicker) + '</div>' +
        '<h1>' + esc(G.title) + '</h1>' +
        '<p class="lead">' + esc(G.consigne) + '</p>' +
        '<div class="chips" aria-label="Catégories">' + chips + '</div>' +
        '<p class="meta">' + esc(G.meta) + '</p>' +
        note +
        '<button class="btn" id="start" type="button">Commencer</button>' +
      '</section>';
    $("#start").addEventListener("click", startGame);
    window.scrollTo(0, 0);
  }

  /* ---------- Jeu ---------- */
  function startGame() {
    order = shuffle(G.cards);
    idx = 0; answers = []; locked = false;
    renderCard();
  }

  function zonesHTML() {
    var n = G.categories.length;
    var html = G.categories.map(function (c) {
      var body = n === 5 && c === G.categories[4]
        ? '<span class="ico">' + c.icon + '</span><span class="txt"><span class="lbl">' + esc(c.label) + '</span><span class="sub">' + esc(c.sub) + '</span></span>'
        : '<span class="ico">' + c.icon + '</span><span class="lbl">' + esc(c.label) + '</span><span class="sub">' + esc(c.sub) + '</span>';
      return '<button type="button" class="zone" data-id="' + c.id + '" style="--c:' + c.color + '" aria-label="Classer dans : ' + esc(c.label) + '">' + body + '</button>';
    }).join("");
    return '<div class="zones z' + n + '" id="zones">' + html + '</div>';
  }

  function renderCard() {
    hideSheet();
    locked = false;
    var card = order[idx];
    var pct = (idx / order.length) * 100;
    screen.innerHTML =
      '<div class="hud"><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="' + order.length + '" aria-valuenow="' + idx + '"><div class="bar" style="width:' + pct + '%"></div></div>' +
      '<div class="count">' + (idx + 1) + ' / ' + order.length + '</div></div>' +
      '<div class="stage">' +
        '<div class="card enter" id="card" role="group" aria-label="Réplique à classer">' + esc(qt(card.t)) + '</div>' +
        '<p class="hint">' + esc(G.hint) + '</p>' +
      '</div>' +
      zonesHTML();
    cardEl = $("#card");
    bindDrag(cardEl);
    Array.prototype.forEach.call(document.querySelectorAll(".zone"), function (z) {
      z.addEventListener("click", function () { classify(z.getAttribute("data-id")); });
    });
    window.scrollTo(0, 0);
  }

  /* Glisser-déposer (souris, doigt, stylet) */
  function zoneAt(x, y) {
    var found = null, zs = document.querySelectorAll(".zone");
    for (var i = 0; i < zs.length; i++) {
      var r = zs[i].getBoundingClientRect(), m = 6;
      if (x >= r.left - m && x <= r.right + m && y >= r.top - m && y <= r.bottom + m) { found = zs[i]; break; }
    }
    return found;
  }
  function clearHover() {
    Array.prototype.forEach.call(document.querySelectorAll(".zone.hover"), function (z) { z.classList.remove("hover"); });
  }
  function bindDrag(el) {
    var sx = 0, sy = 0, active = false, moved = false;
    el.addEventListener("pointerdown", function (e) {
      if (locked || (e.pointerType === "mouse" && e.button !== 0)) return;
      active = true; moved = false; sx = e.clientX; sy = e.clientY;
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      el.classList.add("drag");
    });
    el.addEventListener("pointermove", function (e) {
      if (!active) return;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) + Math.abs(dy) > 8) moved = true;
      el.style.transform = "translate(" + dx + "px," + dy + "px) rotate(" + (dx / 28) + "deg)";
      var z = zoneAt(e.clientX, e.clientY);
      clearHover();
      if (z) z.classList.add("hover");
    });
    function end(e, cancel) {
      if (!active) return;
      active = false;
      el.classList.remove("drag");
      var z = cancel ? null : zoneAt(e.clientX, e.clientY);
      clearHover();
      el.style.transform = "";
      if (moved && z) classify(z.getAttribute("data-id"));
    }
    el.addEventListener("pointerup", function (e) { end(e, false); });
    el.addEventListener("pointercancel", function (e) { end(e, true); });
  }

  function classify(catId) {
    if (locked) return;
    locked = true;
    var card = order[idx];
    var ok = catId === card.c;
    answers.push({ card: card, chosen: catId, ok: ok });
    cardEl.classList.add(ok ? "ok" : "ko");
    $("#zones").classList.add("off");
    showSheet(card, ok, catId);
  }

  function showSheet(card, ok, chosen) {
    var last = idx === order.length - 1;
    var html =
      '<div class="in">' +
        '<div class="verdict ' + (ok ? "ok" : "ko") + '">' + (ok ? ICON_OK : ICON_KO) + '<span>' + (ok ? "Bien vu" : "Pas tout à fait") + '</span></div>' +
        '<div class="answer-line">' +
          (ok ? '<span>C’est bien :</span>' + chipHTML(card.c)
              : '<span>Vous avez choisi</span>' + chipHTML(chosen) + '<span>et c’était</span>' + chipHTML(card.c)) +
        '</div>' +
        '<p class="why">' + esc(card.why) + '</p>' +
        (card.debate ? '<div class="debate-tag">' + esc(G.debateTag) + '</div>' : "") +
        '<button class="btn" id="next" type="button">' + (last ? "Voir mon résultat" : (G.nextLabel || "Réplique suivante")) + '</button>' +
      '</div>';
    sheet.style.setProperty("--fb", ok ? "var(--ok)" : "var(--ko)");
    sheet.innerHTML = html;
    sheet.setAttribute("aria-hidden", "false");
    requestAnimationFrame(function () { sheet.classList.add("show"); });
    var nx = $("#next");
    nx.addEventListener("click", function () {
      if (last) { renderResult(); } else { idx++; renderCard(); }
    });
    setTimeout(function () { try { nx.focus({ preventScroll: true }); } catch (e) {} }, 320);
  }
  function hideSheet() {
    sheet.classList.remove("show");
    sheet.setAttribute("aria-hidden", "true");
  }

  /* ---------- Résultat ---------- */
  function renderResult() {
    hideSheet();
    var n = answers.length;
    var score = answers.filter(function (a) { return a.ok; }).length;
    var band = G.bands.filter(function (b) { return score >= b.min; })[0];
    var R = 52, C = 2 * Math.PI * R;
    var recap = answers.map(function (a) {
      var extra = a.ok ? "" : '<span class="small">Vous : ' + esc(cats[a.chosen].label) + ' · Attendu : ' + esc(cats[a.card.c].label) + '</span>';
      return '<li class="' + (a.ok ? "ok" : "ko") + '">' + (a.ok ? ICON_OK : ICON_KO) +
        '<span>' + esc(qt(a.card.t)) +
        '<span class="small">' + esc(cats[a.card.c].label) + '</span>' + extra + '</span></li>';
    }).join("");
    var debate = "";
    if (G.debrief) {
      var list = G.cards.filter(function (c) { return c.debate; }).map(function (c) {
        return "<li>" + esc(qt(c.t)) + "</li>";
      }).join("");
      debate =
        '<div class="block debate"><h3>' + esc(G.debrief.title) + '</h3>' +
        '<ul>' + list + '</ul>' +
        '<p class="q">' + esc(G.debrief.question) + '</p>' +
        '<button class="btn ghost" id="revealBtn" type="button">Voir un éclairage</button>' +
        '<div class="reveal" id="reveal">' + esc(G.debrief.answer) + '</div></div>';
    }
    screen.innerHTML =
      '<section class="result">' +
        '<div class="score-wrap">' +
          '<div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="' + R + '" fill="none" stroke-width="11"/>' +
          '<circle class="val" cx="60" cy="60" r="' + R + '" fill="none" stroke-width="11" stroke-linecap="round" stroke-dasharray="' + C + '" stroke-dashoffset="' + C + '"/></svg>' +
          '<div class="num">' + score + ' / ' + n + '</div></div>' +
          '<div class="score-msg"><h2>' + esc(band.title) + '</h2><p>' + esc(band.text) + '</p></div>' +
        '</div>' +
        debate +
        '<div class="block"><h3>Le détail de vos réponses</h3><ul class="recap">' + recap + '</ul></div>' +
        (G.closing ? '<p class="closing">' + esc(G.closing) + '</p>' : "") +
        '<div class="actions"><button class="btn" id="again" type="button">Rejouer</button></div>' +
      '</section>';
    var val = document.querySelector(".ring .val");
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { val.style.strokeDashoffset = String(C * (1 - score / n)); });
    });
    $("#again").addEventListener("click", startGame);
    var rb = $("#revealBtn");
    if (rb) rb.addEventListener("click", function () {
      $("#reveal").classList.add("show");
      rb.style.display = "none";
    });
    window.scrollTo(0, 0);
  }

  renderIntro();
})();
</script>
</body>
</html>
